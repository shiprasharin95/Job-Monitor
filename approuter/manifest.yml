applications:
  - name: cloud-alm-job-monitor-router
    memory: 256M
    disk_quota: 256M
    instances: 1
    stack: cflinuxfs5
    buildpacks:
      - nodejs_buildpack
    command: npm start
    routes:
      - route: job-failure-monitor.cfapps.eu20-001.hana.ondemand.com
    services:
      - cloud-alm-job-monitor-xsuaa
    env:
      destinations: '[{"name":"srv-api","url":"https://job-failure-monitor-srv.cfapps.eu20-001.hana.ondemand.com","forwardAuthToken":true}]'
